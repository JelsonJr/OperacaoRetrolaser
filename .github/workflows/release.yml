name: Gerar Instaladores e Releases

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build para ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            installer-pattern: "*.deb"
          - os: windows-latest
            installer-pattern: "*.exe"

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Instalar WiX Toolset (Apenas Windows)
        if: runner.os == 'Windows'
        run: choco install wixtoolset

      - name: Gerar pacote .deb (Linux)
        if: runner.os == 'Linux'
        run: |
          jpackage \
            --type deb \
            --name "Operação Retrolaser" \
            --linux-package-name "operacao-retrolaser" \
            --input out/artifacts/OperacaoRetrolaser_jar \
            --main-jar DeadOpsArcade.jar \
            --linux-shortcut \
            --icon src/main/resources/files/icon.png

      - name: Gerar pacote .exe (Windows)
        if: runner.os == 'Windows'
        run: |
          jpackage `
            --type exe `
            --name "Operacao-Retrolaser" `
            --input out/artifacts/OperacaoRetrolaser_jar `
            --main-jar DeadOpsArcade.jar `
            --win-shortcut `
            --win-menu `
            --icon src/main/resources/files/icon.ico

      - name: Publicar na aba Releases do Repositório
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.installer-pattern }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}